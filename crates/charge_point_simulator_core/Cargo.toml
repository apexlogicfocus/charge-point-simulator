[package]
name = "charge_point_simulator_core"
description = "OCPP Charge Point Simulator. Use this library to simulate the use of a charger point"
repository = "https://github.com/flowionab/charge-point-simulator"
license = "MIT OR Apache-2.0"
authors = ["Joatin Granlund <joatin@granlund.io>"]
keywords = ["OCPP", "CP", "ChargePoint", "ocpp16", "ocpp201"]
version.workspace = true
edition.workspace = true
publish.workspace = true


[dependencies]
tokio.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
async-trait = "0.1"
dirs = "6"
ocpp-charge-point = "0.1.0"
ocpp-client = { version = "0.5", default-features = false }

[dev-dependencies]
tempfile = "3"
# Only for the `connect_charger` builder-registration equivalence test in `charger/connect.rs`,
# which has to implement `ocpp_charge_point::provisioning::HeartbeatSender` for its fake CSMS -
# that trait's `send_heartbeat` returns `chrono::DateTime<Utc>`, and naming that type in our own
# impl needs `chrono` as a direct dependency even though `ocpp-charge-point` already depends on it.
chrono = "0.4"