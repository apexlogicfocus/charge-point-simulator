[package]
name = "charge_point_simulator_core"
description = "OCPP Charge Point Simulator. Use this library to simulate the use of a charger point"
repository = "https://github.com/flowionab/charge-point-simulator"
license = "MIT OR Apache-2.0"
authors = ["Joatin Granlund <joatin@granlund.io>"]
keywords = ["OCPP", "CP", "ChargePoint", "ocpp16", "ocpp201"]
version.workspace = true
edition.workspace = true
publish.workspace = true


[dependencies]
tokio.workspace = true
tracing.workspace = true
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
async-trait = "0.1"
dirs = "6"
ocpp-charge-point = "0.1.0"
ocpp-client = { version = "0.5", default-features = false }
# `ocpp_charge_point::hardware::CertificateStore::expires_at` names `chrono::DateTime<Utc>`
# directly, and `charger/hardware/certificates.rs` implements that trait, so `chrono` has to be a
# direct (non-dev) dependency even though `ocpp-charge-point` already depends on it.
chrono = "0.4"
# `charger/hardware/crypto.rs` implements `ocpp_charge_point::hardware::SoftwareCrypto` directly
# against RustCrypto's ECDSA primitives (`docs/hardware-roadmap.md` decision 5, reversing an earlier
# choice of `ring`, which cannot sign a pre-hashed digest without hashing it again - see that
# module's docs). `p256` and `p384` re-export the `ecdsa` and `elliptic_curve`/`signature` crates
# they are built on (`p256::ecdsa`, `p256::elliptic_curve`, `p256::ecdsa::signature`), so those don't
# need to be listed here separately.
p256 = "0.14"
p384 = "0.14"

[dev-dependencies]
tempfile = "3"
# Used only by `charger/hardware/crypto.rs`'s tests, to build a digest shaped like the one
# `certificates/csr.rs` hands to `KeyStore::sign` and to reproduce the exact "hash it twice" shape
# that disqualified the `ring` backend, so the no-double-hash test is a faithful reproduction rather
# than an arbitrary byte string.
sha2 = "0.11"